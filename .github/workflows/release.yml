name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package zip and DMG
        run: bash Scripts/make-dist.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Flick-*.zip
            dist/Flick-*.dmg
          generate_release_notes: true
