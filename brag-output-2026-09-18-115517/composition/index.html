<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Flick brag</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4efe4;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #141414;
      }
      .fill {
        position: absolute;
        inset: 0;
        background: #f4efe4;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        pointer-events: none;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 120px 140px;
      }
      .display {
        font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 0.9;
      }
      .kicker {
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #5c564c;
        margin-bottom: 28px;
      }
      .line {
        font-size: 120px;
      }
      .sub {
        margin-top: 28px;
        font-size: 28px;
        color: #5c564c;
      }
      .hud {
        width: 980px;
        margin: 0 auto;
        background: #1c1c1e;
        color: #f5f5f7;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 40px 80px rgba(20, 20, 20, 0.28);
      }
      .hud-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 28px 32px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 36px;
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 12px 16px 20px;
        padding: 16px 18px;
        border-radius: 14px;
        background: rgba(10, 132, 255, 0.32);
      }
      .hud-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(#4da3ff, #0a64d6);
      }
      .spec {
        width: 1100px;
        margin: 0 auto;
      }
      .spec-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 28px 0;
        border-bottom: 1px solid #cfc6b6;
        font-size: 40px;
      }
      .spec-row span:last-child {
        font-family: Palatino, Georgia, serif;
        font-style: italic;
        font-size: 56px;
      }
      .mark {
        width: 220px;
        height: 220px;
        object-fit: contain;
        margin-bottom: 36px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div id="paper" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div class="fill"></div>
        <div id="grain" class="grain"></div>
      </div>

      <section id="scene-slow" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div class="stage">
          <p class="kicker">01</p>
          <h1 id="hook" class="display line">Spotlight is slow.</h1>
        </div>
      </section>

      <section id="scene-summon" class="clip" data-start="3.2" data-duration="4.2" data-track-index="2">
        <div class="stage">
          <img id="logo" class="mark" src="assets/brand/logo.png" alt="" />
          <h1 id="summon" class="display line">Option+Space.</h1>
          <p id="summon-sub" class="sub">A native launcher for Mac.</p>
        </div>
      </section>

      <section id="scene-type" class="clip" data-start="7.2" data-duration="6.2" data-track-index="1">
        <div class="stage">
          <div class="hud">
            <div class="hud-bar">
              <span style="opacity:0.5">⌥</span>
              <span><span id="ch-s">s</span><span id="ch-a">a</span><span id="ch-f">f</span><span id="caret">|</span></span>
            </div>
            <div id="safari-row" class="hud-row">
              <div class="hud-icon"></div>
              <div>
                <div style="font-size:28px;font-weight:500">Safari</div>
                <div style="font-size:18px;opacity:0.45;margin-top:4px">/Applications/Safari.app</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="scene-press" class="clip" data-start="13.2" data-duration="4.2" data-track-index="2">
        <div class="stage">
          <p class="kicker">Specimen</p>
          <div class="spec">
            <div id="key-1" class="spec-row"><span>⌥ Space</span><span>Summon</span></div>
            <div id="key-2" class="spec-row"><span>↩</span><span>Open</span></div>
            <div id="key-3" class="spec-row"><span>Esc</span><span>Dismiss</span></div>
          </div>
        </div>
      </section>

      <section id="scene-copy" class="clip" data-start="17.2" data-duration="2.8" data-track-index="1">
        <div class="stage">
          <img id="wordmark" class="mark" src="assets/brand/wordmark.png" alt="" style="width:520px;height:auto" />
          <p id="copy-line" class="sub">Take a copy.</p>
        </div>
      </section>

      <audio id="bg-music" data-start="0" data-duration="20" data-track-index="10" data-volume="0.18" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-hook" data-start="0.5" data-duration="1" data-track-index="11" data-volume="0.55" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-logo" data-start="3.27" data-duration="1" data-track-index="12" data-volume="0.6" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-k1" data-start="7.6" data-duration="1" data-track-index="13" data-volume="0.45" src="assets/sfx/keyboard/keypress-001.wav"></audio>
      <audio id="sfx-k2" data-start="8.1" data-duration="1" data-track-index="14" data-volume="0.45" src="assets/sfx/keyboard/keypress-004.wav"></audio>
      <audio id="sfx-k3" data-start="8.6" data-duration="1" data-track-index="15" data-volume="0.45" src="assets/sfx/keyboard/keypress-012.wav"></audio>
      <audio id="sfx-row" data-start="8.74" data-duration="1" data-track-index="16" data-volume="0.55" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-keyrow" data-start="13.6" data-duration="1" data-track-index="17" data-volume="0.5" src="assets/sfx/interface/click_003.ogg"></audio>
      <audio id="sfx-end" data-start="17.47" data-duration="1" data-track-index="18" data-volume="0.62" src="assets/sfx/interface/bong_001.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#hook", { y: 28, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.45);

      // beat-locked: Option+Space near 3.27s
      tl.from("#logo", { y: 20, opacity: 0, scale: 0.96, duration: 0.6, ease: "power3.out" }, 3.27);
      tl.from("#summon", { y: 24, opacity: 0, duration: 0.7, ease: "power3.out" }, 3.55);
      tl.from("#summon-sub", { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.1);

      tl.from("#ch-s", { opacity: 0, duration: 0.12 }, 7.55);
      tl.from("#ch-a", { opacity: 0, duration: 0.12 }, 8.1);
      tl.from("#ch-f", { opacity: 0, duration: 0.12 }, 8.6);
      // beat-locked: Safari row near 8.74s
      tl.from("#safari-row", { y: 12, opacity: 0, duration: 0.45, ease: "power3.out" }, 8.74);

      // beat-grid: keys at 13.64, 14.73, 15.84
      tl.from("#key-1", { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 13.64);
      tl.from("#key-2", { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 14.73);
      tl.from("#key-3", { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 15.84);

      // beat-locked: FLICK near 17.47s
      tl.from("#wordmark", { y: 18, opacity: 0, duration: 0.55, ease: "power3.out" }, 17.47);
      tl.from("#copy-line", { opacity: 0, duration: 0.45, ease: "power2.out" }, 17.9);

      tl.to("#grain", { opacity: 0.12, duration: 10, ease: "sine.inOut" }, 0);
      tl.to("#grain", { opacity: 0.06, duration: 10, ease: "sine.inOut" }, 10);
      tl.to("#caret", { opacity: 0.2, duration: 0.4, yoyo: true, repeat: 24, ease: "none" }, 7.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
